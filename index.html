  HOW TO USE
    1. Download this file.
    2. Double click it. It opens in your browser.
    3. That is all. No account, no install, no server.

  LANGUAGE
    The interface follows your browser's language, English or French,
    and the FR/EN button in the header switches it at any time.

  PRIVACY

    Your cards live in your browser's localStorage, on your machine only.
